
            <!DOCTYPE html>

            <html lang="it">

            <head>

                <meta charset="UTF-8"> <!-- codifica UTF8 -->

                <title>IRON_2026</title> <!-- titolo della scheda browser -->

            </head>
            <script>

                function applicaFiltri() {
                    const atleta =                                                    // legge il testo atleta
                        document.getElementById('txtAtleta')
                            .value
                            .trim()
                            .toUpperCase();


                    const righe =                                                     // recupera tutte le righe
                        document.querySelectorAll('#corpoTabella tr');

                    righe.forEach(
                        function (riga) {

                            const testoAtleta =
                                riga.dataset.atleta              // legge data-atleta
                                    .trim()
                                    .toUpperCase();


                            let visibile = true;                                      // inizialmente visibile

                            if (
                                atleta !== '' &&                                      // filtro atleta valorizzato
                                !testoAtleta.includes(atleta)                         // atleta non trovato
                            ) {
                                visibile = false;                                     // nasconde la riga
                            }

                            riga.style.display =                                      // mostra o nasconde
                                visibile
                                    ? 'table-row'                                     // visualizza la riga
                                    : 'none';                                         // nasconde la riga

                        }
                    );


                }

                function ordinaTabella(campo) {                                        // ordina la tabella

                    const corpoTabella =
                        document.getElementById('corpoTabella');                       // tbody iron

                    const righe =
                        Array.from(
                            corpoTabella.querySelectorAll('tr')
                        );                                                             // tutte le righe

                    righe.sort(
                        function (a, b) {

                            // ==========================================================
                            // ATLETA
                            // ==========================================================

                            if (campo === 'atleta') {

                                return a.dataset.atleta
                                    .localeCompare(
                                        b.dataset.atleta
                                    );

                            }

                                       }
            </script>

            <body>

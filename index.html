<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuoto Master Nautilus</title>

  <style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    font-family:Arial, sans-serif;
    background:#eaf4ff;
  }

  .header{
    height:70px;
    background:#004a99;
    color:white;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-size:28px;
    font-weight:bold;
  }

  .container{
    display:flex;
    height:calc(100vh - 70px);
  }

  .menu{
    width:250px;
    background:#1976d2;
    padding:20px;
  }

  .menu a{
    display:block;
    background:white;
    color:#1976d2;
    text-decoration:none;
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
    font-weight:bold;
  }

  .menu a:hover{
    background:#d7ecff;
  }

  .content{
    flex:1;
    padding:20px;
    background:white;
  }

  .filters{
    background:#eaf4ff;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
  }

  .filters select{
    padding:8px;
    margin-right:10px;
  }

  .title{
    font-size:24px;
    color:#004a99;
    margin-bottom:20px;
    font-weight:bold;
  }

  .pdf-area{
    border:2px solid #c5def7;
    border-radius:8px;
    padding:30px;
    text-align:center;
    background:#f8fbff;
  }

  .pdf-link{
    display:inline-block;
    padding:12px 20px;
    background:#1976d2;
    color:white;
    text-decoration:none;
    border-radius:6px;
  }

  .pdf-link:hover{
    background:#004a99;
  }

  </style>

</head>

<body>

  <div class="header">
    NUOTO MASTER NAUTILUS
  </div>

  <div class="container">

    <div class="menu">

      #Risultati</a>

      #Classifica Iron</a>

      #Miglior Punteggio</a>

      #Regolamento</a>

    </div>

    <div class="content">

      <div class="filters">

        Stagione

        <select>
          <option>2026/2027</option>
          <option>2025/2026</option>
          <option>2024/2025</option>
        </select>

        Ordinamento

        <select>
          <option>Più recente</option>
          <option>Più vecchia</option>
        </select>

      </div>

      <div class="title">
        Risultati Gare 2026/2027
      </div>

      <div class="pdf-area">

        <p>
          Apri il PDF dei risultati:
        </p>

        <br>

        risultati/RISGARE_2026.pdf

          APRI PDF

        </a>

      </div>

    </div>

  </div>

</body>

</html>

<!DOCTYPE html> <!-- DICHIARAZIONE HTML -->

<html lang="it"> <!-- INIZIO HTML -->

<head> <!-- INIZIO HEAD -->

    <meta charset="UTF-8"> <!-- codifica caratteri -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive -->

    <title>Nuoto Master Nautilus</title> <!-- titolo pagina -->

    <link rel="stylesheet" href="style.css"> <!-- foglio di stile -->

</head> <!-- FINE HEAD -->

<body> <!-- INIZIO BODY -->

    <!-- ========================================================= -->
    <!-- TESTATA                                                   -->
    <!-- ========================================================= -->

    <div class="header"> <!-- INIZIO HEADER -->

        <div class="logo"> <!-- INIZIO LOGO -->

            <img src="img/logo.png" alt="Logo Nautilus">

        </div> <!-- FINE LOGO -->

        <div class="site-title"> <!-- INIZIO SITE-TITLE -->

            <h1>NAUTILUS - NUOTO MASTER</h1>

            <p>Classifiche e risultati gare</p>

        </div> <!-- FINE SITE-TITLE -->

        <div class="pool-photo"> <!-- INIZIO POOL-PHOTO -->

            <img src="img/piscina.png" alt="Piscina">

        </div> <!-- FINE POOL-PHOTO -->

    </div> <!-- FINE HEADER -->


    <!-- ========================================================= -->
    <!-- CONTENUTO PRINCIPALE                                      -->
    <!-- ========================================================= -->

    <div class="container"> <!-- INIZIO CONTAINER -->


        <!-- ===================================================== -->
        <!-- COLONNA SINISTRA                                      -->
        <!-- ===================================================== -->

        <div class="sidebar"> <!-- INIZIO SIDEBAR -->


            <!-- ================================================= -->
            <!-- STAGIONE E MENU STAMPE                              -->
            <!-- ================================================= -->

            <div class="filter-box"> <!-- INIZIO FILTER-BOX -->

                <h3>STAGIONE</h3> <!-- titolo stagione -->

                <select id="cmbStagione"></select> <!-- combo stagioni -->


                <!-- ================================================= -->
                <!-- MENU                                              -->
                <!-- ================================================= -->

                <div class="menu"> <!-- INIZIO MENU -->

                    <div class="menu-item active"> <!-- INIZIO MENU-ITEM -->

                        <a href="risultati/RISGARE_2026.html">Risultati gare</a>

                    </div> <!-- FINE MENU-ITEM -->

                    <div class="menu-item"> <!-- INIZIO MENU-ITEM -->

                        Classifica Iron

                    </div> <!-- FINE MENU-ITEM -->

                    <div class="menu-item"> <!-- INIZIO MENU-ITEM -->

                        Miglior punteggio

                    </div> <!-- FINE MENU-ITEM -->

                    <div class="menu-item"> <!-- INIZIO MENU-ITEM -->

                        Regolamento Iron

                    </div> <!-- FINE MENU-ITEM -->

                </div> <!-- FINE MENU -->

                <h3>FILTRA PER</h3> <!-- titolo filtri -->

                <select> <!-- INIZIO SELECT ATLETA -->

                    <option>Atleta</option>

                </select> <!-- FINE SELECT ATLETA -->

                <select> <!-- INIZIO SELECT MANIFESTAZIONE -->

                    <option>Manifestazione</option>

                </select> <!-- FINE SELECT MANIFESTAZIONE -->

            </div> <!-- FINE FILTER-BOX -->

        </div> <!-- FINE SIDEBAR -->


        <!-- ===================================================== -->
        <!-- COLONNA CENTRALE                                      -->
        <!-- ===================================================== -->

        <div class="content"> <!-- INIZIO CONTENT -->


            <!-- ================================================= -->
            <!-- TITOLO PAGINA                                     -->
            <!-- ================================================= -->

            <div class="page-title"> <!-- INIZIO PAGE-TITLE -->

                <div id="titoloStagione" class="season"> <!-- INIZIO SEASON -->

                </div> <!-- FINE SEASON -->

                <div id="titoloStampa" class="page-name"> <!-- INIZIO PAGE-NAME -->

                </div> <!-- FINE PAGE-NAME -->

            </div> <!-- FINE PAGE-TITLE -->


            <!-- ================================================= -->
            <!-- AREA CONTENUTI                                    -->
            <!-- ================================================= -->

            <div class="print-area"> <!-- INIZIO PRINT-AREA -->

                <iframe id="contenutoStampa" src="risultati/RISGARE_2026.html"
                    style="width:100%; height:800px; border:none;">
                </iframe>

            </div> <!-- FINE PRINT-AREA -->

        </div> <!-- FINE CONTENT -->

    </div> <!-- FINE CONTAINER -->


    <!-- ========================================================= -->
    <!-- CARICAMENTO COMBO STAGIONI                               -->
    <!-- ========================================================= -->

    <script>                                                              /* INIZIO SCRIPT */

        const stagioniDisponibili = [2026];                               /* stagioni pubblicate */

        const cmbStagione = document.getElementById('cmbStagione');        /* recupera la combo */

        stagioniDisponibili.forEach(stagione => {                         /* ciclo stagioni */

            const option = document.createElement('option');              /* crea opzione */

            option.value = stagione;                                      /* valore interno */

            option.textContent = `${stagione}/${stagione + 1}`;           /* testo visibile */

            cmbStagione.appendChild(option);                              /* aggiunge opzione */

        });
    const stagioneCorrente = 2026; // stagione caricata all'avvio

    document.getElementById('titoloStagione').textContent =
    'STAGIONE ' + stagioneCorrente + '/' + (stagioneCorrente + 1); // aggiorna il titolo stagione

    document.getElementById('titoloStampa').textContent =
    'RISULTATI GARE'; // aggiorna il titolo stampa
    </script> <!-- FINE SCRIPT -->

</body> <!-- FINE BODY -->

</html> <!-- FINE HTML -->

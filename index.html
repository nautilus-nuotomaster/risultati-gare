<!DOCTYPE html> <!-- DICHIARAZIONE HTML -->

<html lang="it"> <!-- INIZIO HTML -->

<head> <!-- INIZIO HEAD -->

    <meta charset="UTF-8"> <!-- codifica caratteri -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive -->

    <title>Nuoto Master Nautilus</title> <!-- titolo pagina -->

    <link rel="stylesheet" href="style.css"> <!-- foglio di stile -->

</head> <!-- FINE HEAD -->

<body> <!-- INIZIO BODY -->

    <!-- ========================================================= -->
    <!-- TESTATA                                                   -->
    <!-- ========================================================= -->

    <div class="header"> <!-- INIZIO HEADER -->

        <div class="logo"> <!-- INIZIO LOGO -->

            <img src="img/logo.png" alt="Logo Nautilus">

        </div> <!-- FINE LOGO -->

        <div class="site-title"> <!-- INIZIO SITE-TITLE -->

            <h1>NAUTILUS - NUOTO MASTER</h1>

            <p>Classifiche e risultati gare</p>

        </div> <!-- FINE SITE-TITLE -->

        <div class="pool-photo"> <!-- INIZIO POOL-PHOTO -->

            <img src="img/piscina.png" alt="Piscina">

        </div> <!-- FINE POOL-PHOTO -->

    </div> <!-- FINE HEADER -->


    <!-- ========================================================= -->
    <!-- CONTENUTO PRINCIPALE                                      -->
    <!-- ========================================================= -->

    <div class="container"> <!-- INIZIO CONTAINER -->


        <!-- ===================================================== -->
        <!-- COLONNA SINISTRA                                      -->
        <!-- ===================================================== -->

        <div class="sidebar"> <!-- INIZIO SIDEBAR -->


            <!-- ================================================= -->
            <!-- STAGIONE E MENU STAMPE                              -->
            <!-- ================================================= -->

            <div class="filter-box"> <!-- INIZIO FILTER-BOX -->

                <h3>STAGIONE</h3> <!-- titolo stagione -->

                <select id="cmbStagione"></select> <!-- combo stagioni -->


                <!-- ================================================= -->
                <!-- MENU                                              -->
                <!-- ================================================= -->

                <div class="menu" id="menuDinamico">

                </div> <!-- FINE MENU -->

                <h3>FILTRA PER</h3> <!-- titolo filtri -->

                <input id="txtAtleta" type="text" placeholder="Scrivi atleta..." oninput="applicaFiltri()">
                <!-- filtro atleta -->

                <input id="txtManifestazione" type="text" placeholder="Scrivi manifestazione..."
                    oninput="applicaFiltri()"> <!-- filtro manifestazione -->

            </div> <!-- FINE FILTER-BOX -->

        </div> <!-- FINE SIDEBAR -->


        <!-- ===================================================== -->
        <!-- COLONNA CENTRALE                                      -->
        <!-- ===================================================== -->

        <div class="content"> <!-- INIZIO CONTENT -->


            <!-- ================================================= -->
            <!-- TITOLO PAGINA                                     -->
            <!-- ================================================= -->

            <div class="page-title"> <!-- INIZIO PAGE-TITLE -->

                <div id="titoloStagione" class="season"> <!-- INIZIO SEASON -->

                </div> <!-- FINE SEASON -->

                <div id="titoloStampa" class="page-name"> <!-- INIZIO PAGE-NAME -->

                </div> <!-- FINE PAGE-NAME -->

            </div> <!-- FINE PAGE-TITLE -->


            <!-- ========================================================= -->
            <!-- AREA CONTENUTI                                            -->
            <!-- ========================================================= -->

           
            <div class="print-area"> <!-- INIZIO PRINT-AREA -->

                <iframe id="contenutoStampa" style="width:100%; height:800px; border:none;">
                </iframe>

            </div> <!-- FINE PRINT-AREA -->

        </div> <!-- FINE CONTENT -->

    </div> <!-- FINE CONTAINER -->


    <!-- ========================================================= -->
    <!-- CARICAMENTO COMBO STAGIONI                               -->
    <!-- ========================================================= -->

    <script>                                                    /* INIZIO SCRIPT */

        const stagioniDisponibili =
            [2026,2025];                     // generato da NuotoMaster

        const pubblicazioni = [

            {
  codice: "CLAMIGPUN_2025",
  tipo: "MIGLIOR PUNTEGGIO",
  titolo: "Classifica miglior punteggio 2025/2026"
}
,{
  codice: "CLAMIGPUN_2026",
  tipo: "MIGLIOR PUNTEGGIO",
  titolo: "Classifica miglior punteggio 2026/2027"
}
,{
  codice: "RISGARE_2025",
  tipo: "RISULTATI GARE",
  titolo: "Risultati Gare 2025/2026"
}
,{
  codice: "RISGARE_2026",
  tipo: "RISULTATI GARE",
  titolo: "Risultati Gare 2026/2027"
}


        ];                                   // generato da NuotoMaster

        const cmbStagione =
            document.getElementById('cmbStagione');             /* combo stagione */

        stagioniDisponibili.forEach(stagione => {               /* carica combo */

            const option =
                document.createElement('option');

            option.value = stagione;

            option.textContent =
                `${stagione}/${stagione + 1}`;

            cmbStagione.appendChild(option);

        });

        let tipoCorrente =
            'RISULTATI GARE';                 // stampa iniziale

        function caricaPubblicazione(
            tipo
        ) {

            tipoCorrente = tipo;              // memorizza stampa scelta

            const stagione =
                cmbStagione.value;
            const pubblicazione =
                pubblicazioni.find(
                    p =>
                        p.tipo === tipo &&
                        p.codice.endsWith(
                            stagione
                        )
                );


            if (!pubblicazione) {

                document
                    .getElementById(
                        'contenutoStampa'
                    )
                    .src = '';

                return;
            }

            document
                .getElementById(
                    'titoloStampa'
                )
                .textContent =
                pubblicazione.titolo;

            document
                .getElementById(
                    'titoloStagione'
                )
                .textContent =
                'STAGIONE ' +
                stagione +
                '/' +
                (
                    parseInt(
                        stagione
                    ) + 1
                );

            document
                .getElementById(
                    'contenutoStampa'
                )
                .src =
                'risultati/' +
                pubblicazione.codice +
                '.html';
        }
        function generaMenu() {

            const menu =
                document.getElementById(
                    'menuDinamico'
                );

            menu.innerHTML = '';

            const stagione =
                cmbStagione.value;

            const pubblicazioniStagione =
                pubblicazioni.filter(
                    p =>
                        p.codice.endsWith(
                            stagione
                        )
                );

            pubblicazioniStagione.forEach(
                p => {

                    const voce =
                        document.createElement(
                            'div'
                        );

                    voce.className =
                        'menu-item';

                    voce.textContent =
                        p.tipo;

                    voce.onclick =
                        () =>
                            caricaPubblicazione(
                                p.tipo
                            );

                    menu.appendChild(
                        voce
                    );
                }
            );
        }

        cmbStagione.addEventListener(
            'change',
            function () {

                generaMenu();                 // rigenera il menu

                caricaPubblicazione(
                    tipoCorrente
                );                            // mantiene la stampa corrente
            }
        );

        cmbStagione.value =
            stagioniDisponibili[0];          // stagione più recente

        generaMenu();                        // crea il menu

        caricaPubblicazione(
            'RISULTATI GARE'
        );                                   // default all'apertura                                      /* caricamento iniziale */
        function applicaFiltri() {                                     // applica i filtri

            const atleta =
                document.getElementById('txtAtleta')
                    .value
                    .trim()
                    .toUpperCase();                                        // atleta cercato

            const manifestazione =
                document.getElementById('txtManifestazione')
                    .value
                    .trim()
                    .toUpperCase();                                        // manifestazione cercata

            const iframe =
                document.getElementById('contenutoStampa');            // iframe risultati

            const righe =
                iframe.contentWindow.document.querySelectorAll(
                    '#corpoTabella tr'
                );                                                     // righe tabella

            righe.forEach(riga => {

                const atletaRiga =
                    riga.dataset.atleta.toUpperCase();                 // atleta riga

                const manifestazioneRiga =
                    riga.dataset.manifestazione.toUpperCase();         // manifestazione riga

                let visibile = true;                                   // inizialmente visibile

                if (
                    atleta !== '' &&
                    !atletaRiga.includes(atleta)
                ) {
                    visibile = false;
                }

                if (
                    manifestazione !== '' &&
                    !manifestazioneRiga.includes(manifestazione)
                ) {
                    visibile = false;
                }

                riga.style.display =
                    visibile
                        ? 'table-row'
                        : 'none';

            });

        }
    </script> <!-- FINE SCRIPT -->

</body> <!-- FINE BODY -->

</html> <!-- FINE HTML -->

<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nuoto Master Nautilus</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef3f8;
    font-family:Arial, Helvetica, sans-serif;
    padding:15px;
}

.container{
    display:grid;

    grid-template-columns:250px 1fr 220px;
    gap:15px;
    min-height:calc(100vh - 30px);
}

.menu{
    background:#123d82;
    color:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.menu-item{
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;

    transition:.3s;
}

.menu-item:hover{
    background:#2959aa;
}

.menu-item.active{
    background:#ffb800;
    color:#123d82;
    font-weight:bold;
}

.content{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.header{
    background:linear-gradient(
        90deg,
        #123d82,
        #466fc1
    );

    color:white;

    border-radius:15px;

    padding:20px;

    display:grid;

    grid-template-columns:
        130px 1fr 220px;

    gap:20px;

    align-items:center;

    box-shadow:
        0 4px 12px rgba(0,0,0,.2);
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#082a63;
    border:3px solid #ffb800;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;
    font-weight:bold;
}

.site-title{
    text-align:center;
}

.site-title h1{
    font-size:34px;

}

.site-title p{
    margin-top:10px;
    font-size:18px;
}

.pool-photo{
    height:120px;
    border-radius:12px;

    background:#86c8ff;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-weight:bold;
}

.page-title{
    text-align:center;
}

.season{
    color:#345bbf;
    font-size:38px;
    font-weight:bold;
}

.page-name{
    color:#ff7f22;
    font-size:46px;
    font-weight:bold;
    margin-top:10px;

}

.print-area{
    flex:1;

    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:
        0 5px 20px rgba(0,0,0,.15);
}

.print-area h2{
    color:#123d82;
    margin-bottom:20px;
}

.print-area p{
    color:#555;
    font-size:20px;
}

.filters{
    background:#123d82;
    color:white;
    border-radius:15px;
    padding:20px;

    display:flex;
    flex-direction:column;
    gap:20px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.2);

}

.box{
    background:

        rgba(255,255,255,.1);

    padding:15px;

    border-radius:10px;
}

.box h3{
    margin-bottom:15px;
}

select{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;

}

@media(max-width:1000px){

    .container{
        grid-template-columns:1fr;
    }

    .header{
        grid-template-columns:1fr;
        text-align:center;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="menu">
